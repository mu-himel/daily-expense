spring.application.name=daily-accounts-api
server.port=5000
spring.jpa.hibernate.ddl-auto=update

# Keep Docker Compose containers running after the application stops.
spring.docker.compose.lifecycle-management=start-only

# Run Flyway migrations on startup. Baseline an existing schema at version 0 so V1 still applies.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true